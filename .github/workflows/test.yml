name: test

on:
  push:
  pull_request:

# 同一分支的新推送取消上一次运行，避免排队。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    defaults:
      run:
        working-directory: agent-embodiment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: agent-embodiment/package-lock.json
      # devDependencies 只有 oxlint；运行时依然零依赖。
      - run: npm ci --ignore-scripts
      - run: node --check index.js && node --check control.js && node --check client.js && node --check persist.js && node --check profile.js
      - run: npm test
      - run: npm run lint
      # 提前暴露 files/exports 缺文件的问题。
      - run: npm pack --dry-run

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 与 dshReleases 对应的 Cordis 线：0.2.0/0.2.1 用 4.0.5，0.2.2 起用 4.1.0。
        include:
          - cordis: '4.0.5'
            cosmokit: '1.8.6'
          - cordis: '4.1.0'
            cosmokit: '1.9.0'
    defaults:
      run:
        working-directory: agent-embodiment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 集成套件原本从本机 app.asar 解出 Cordis；CI 改为从 npm 安装同一运行时，
      # 目录布局与 prepare-deps.mjs 的输出一致（test/deps/dsh/node_modules）。
      - run: |
          mkdir -p test/deps/dsh
          cd test/deps/dsh
          npm init -y > /dev/null
          npm install --no-audit --no-fund @deepseek-ai/cordis@${{ matrix.cordis }} @deepseek-ai/cosmokit@${{ matrix.cosmokit }}
      - run: node test/control.mjs && node test/smoke.mjs && node test/prompt-state.mjs
