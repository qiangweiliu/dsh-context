<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="context-monitor-and-control">
  <defs>
    <linearGradient id="cg-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4a6b"/>
      <stop offset="1" stop-color="#1d2433"/>
    </linearGradient>
    <linearGradient id="cg-arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.6" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>
  </defs>
  <!-- 底板 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#cg-face)"/>
  <!-- 预算表盘：一段 240° 弧 -->
  <path d="M 14 40 A 18 18 0 1 1 50 40" fill="none" stroke="#202836" stroke-width="7" stroke-linecap="round"/>
  <path d="M 14 40 A 18 18 0 0 1 35.5 14.6" fill="none" stroke="url(#cg-arc)" stroke-width="7" stroke-linecap="round"/>
  <!-- 指针：用量指针停在 2/3 处 -->
  <g transform="rotate(24 32 38)">
    <line x1="32" y1="38" x2="32" y2="21" stroke="#e8eefc" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <circle cx="32" cy="38" r="3.6" fill="#e8eefc"/>
  <!-- 底部 token 计数线 -->
  <rect x="18" y="47" width="28" height="3.4" rx="1.7" fill="#8aa0c8" opacity="0.75"/>
  <rect x="18" y="47" width="18" height="3.4" rx="1.7" fill="#e8eefc"/>
</svg>
