name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    defaults:
      run:
        working-directory: ctx-mon-and-con
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # 单元套件不依赖 DSH 运行时；集成套件（control/smoke/prompt-state）
      # 需要本机 app.asar，见 docs/IMPLEMENTATION.md。
      - run: node --check index.js && node --check control.js && node --check client.js
      - run: npm test
      # 提前暴露 files/exports 缺文件的问题。
      - run: npm pack --dry-run
